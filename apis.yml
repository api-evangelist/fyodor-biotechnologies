name: Fyodor Biotechnologies
description: >-
  Fyodor Biotechnologies is a Baltimore, Maryland based biotechnology company
  focused on making malaria diagnosis fast, affordable, and non-invasive. Its
  flagship product, the Urine Malaria Test (UMT), is a rapid diagnostic that
  detects active malaria infection from a urine sample in minutes without a
  blood draw, working much like a home pregnancy test so it can be used at the
  point of care or at home in regions where malaria is endemic. The test has
  been validated through partnerships with Johns Hopkins University, Duke
  University, and the University of Lagos, carries a CE Mark, and has secured
  regulatory approvals in Nigeria, Cote d'Ivoire, Kenya, and the Democratic
  Republic of Congo. Fyodor was surfaced as a portfolio company of 500 Global
  and added to the API Evangelist network. It currently publishes no public
  developer platform, API, or SDKs; this profile captures its identity and
  public web properties.
